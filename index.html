<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>华研专八词汇练习 · 爱子祺版</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
<style>
:root{
  --bg-1:#f6f1ea;
  --bg-2:#eef2f6;
  --card:#ffffff;
  --ink:#3d3a36;
  --ink-2:#6b6660;
  --muted:#b5aea6;
  --line:#e3ddd5;
  --line-strong:#cfc7bd;
  --accent:#c9a27e;
  --accent-ink:#8a6844;
  --cell-word:#f0e8dd;
  --cell-draft:#ffffff;
  --cell-answer:#faf6f0;
  --correct:#6fb892;
  --wrong:#d48a9a;
  --shadow:0 2px 6px rgba(120,105,90,.06),0 18px 48px rgba(120,105,90,.10);
  --r-card:22px;
  --r-cell:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,sans-serif;
  background:
    radial-gradient(120% 80% at 20% 0%, var(--bg-1), transparent 60%),
    radial-gradient(120% 80% at 100% 100%, var(--bg-2), transparent 55%),
    #f4f0ea;
  min-height:100vh;padding:40px 20px 60px;color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
.app{max-width:1100px;margin:0 auto}

/* ── 卡片 ── */
.page-card{
  background:var(--card);border-radius:var(--r-card);
  padding:44px 48px 36px;box-shadow:var(--shadow);
  position:relative;
  transition:background-color .4s ease;
}
.page-card::before{
  content:"";position:absolute;left:48px;right:48px;top:0;height:4px;
  background:linear-gradient(90deg,var(--accent),transparent 80%);
  border-radius:0 0 4px 4px;opacity:.7;
}

/* ── 工具栏 ── */
.toolbar{
  display:flex;justify-content:space-between;align-items:center;
  flex-wrap:wrap;gap:14px;margin-bottom:28px;
}
.theme-dots{display:flex;align-items:center;gap:10px}
.theme-label{font-size:12.5px;color:var(--muted);letter-spacing:.5px;margin-right:2px}
.theme-dot{
  width:24px;height:24px;border-radius:50%;cursor:pointer;
  border:2.5px solid #fff;box-shadow:0 0 0 1.5px var(--line-strong),0 2px 5px rgba(0,0,0,.08);
  transition:transform .2s cubic-bezier(.2,.8,.3,1.2),box-shadow .2s;
}
.theme-dot:hover{transform:scale(1.15)}
.theme-dot.active{
  transform:scale(1.12);
  box-shadow:0 0 0 2px var(--accent),0 3px 8px rgba(0,0,0,.12);
}
.theme-dot[data-theme="blue"]   {background:#cfe3f0}
.theme-dot[data-theme="yellow"] {background:#f5e6b8}
.theme-dot[data-theme="pink"]   {background:#f2ccd6}
.theme-dot[data-theme="purple"]{background:#d8ccee}
.theme-dot[data-theme="mint"]   {background:#c9e8d6}

.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:9px 16px;border:1px solid var(--line);
  border-radius:999px;font-size:13px;cursor:pointer;
  background:#fff;color:var(--ink-2);font-family:inherit;
  transition:all .2s;
}
.btn:hover{background:#f7f3ee;border-color:var(--line-strong);transform:translateY(-1px)}
.btn svg{width:14px;height:14px}
.btn.toggle-col{
  background:#f9f6f2; border-color:var(--line-strong);
  font-size:12.5px; padding:7px 12px;
}
.btn.toggle-col.active{
  background:var(--accent); color:#fff; border-color:var(--accent);
  box-shadow:0 2px 8px rgba(201,162,126,.3);
}
.btn.btn-check{
  background:var(--correct);color:#fff;border-color:var(--correct);
  box-shadow:0 4px 12px rgba(111,184,146,.35);
}
.btn.btn-check:hover{background:#5aa17c;border-color:#5aa17c}

/* ── 标题区 ── */
.header-row{
  display:flex;justify-content:space-between;align-items:flex-end;
  margin-bottom:8px;padding-bottom:18px;
  border-bottom:2px solid var(--line);
  position:relative;
}
.header-row::after{
  content:"";position:absolute;left:0;bottom:-2px;width:64px;height:2px;
  background:var(--accent);
}
.title-input{
  font-size:32px;font-weight:600;border:none;outline:none;
  width:420px;background:transparent;color:var(--ink);
  font-family:Georgia,"Times New Roman",serif;font-style:italic;
  letter-spacing:.3px;
}
.checkin{
  font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;
  font-family:Georgia,serif;font-style:italic;
}
.checkin svg{width:15px;height:15px;color:var(--accent)}

/* ── 章节切换栏 ── */
.chapter-bar{
  display:flex;align-items:center;justify-content:space-between;
  gap:14px;margin:20px 0 6px;
  padding:12px 16px;
  background:linear-gradient(135deg, var(--cell-answer), #fff);
  border:1px solid var(--line);
  border-radius:14px;
  flex-wrap:wrap;
}
.chapter-bar .label{
  font-size:12px;font-weight:700;color:var(--muted);
  letter-spacing:1.5px;text-transform:uppercase;
  display:flex;align-items:center;gap:8px;
  font-family:Georgia,serif;font-style:italic;
}
.chapter-bar .label svg{width:15px;height:15px;color:var(--accent)}

.chapter-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chapter-nav .nav-btn{
  width:34px;height:34px;border-radius:50%;
  border:1px solid var(--line);
  background:#fff;color:var(--ink-2);
  display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .2s;
}
.chapter-nav .nav-btn:hover{
  background:var(--accent);color:#fff;border-color:var(--accent);
  transform:translateY(-1px);
  box-shadow:0 4px 10px rgba(201,162,126,.3);
}
.chapter-nav .nav-btn svg{width:14px;height:14px}
.chapter-nav .nav-btn:disabled{
  opacity:.35;cursor:not-allowed;transform:none;
  background:#fff;color:var(--muted);border-color:var(--line);
  box-shadow:none;
}

.chapter-pill{
  display:flex;align-items:center;gap:4px;
  padding:0 6px;height:38px;
  background:#fff;border:1.5px solid var(--line-strong);
  border-radius:999px;
  transition:border-color .2s, box-shadow .2s;
}
.chapter-pill:focus-within{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(201,162,126,.15);
}
.chapter-pill .prefix{
  font-size:11px;color:var(--muted);font-weight:700;
  letter-spacing:1px;text-transform:uppercase;
  font-family:Georgia,serif;font-style:italic;
  padding-left:8px;
}
.chapter-pill input{
  border:none;outline:none;background:transparent;
  width:52px;text-align:center;
  font-size:16px;font-weight:600;
  font-family:Georgia,serif;font-style:italic;
  color:var(--ink);
}
.chapter-pill .suffix{
  font-size:11px;color:var(--muted);
  padding-right:10px;white-space:nowrap;
  font-family:Georgia,serif;font-style:italic;
}

/* ── 筛选栏 ── */
.filter-bar{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  margin:14px 0 0;
}
.filter-bar .filter-label{
  font-size:11px;font-weight:700;color:var(--muted);
  letter-spacing:1.5px;text-transform:uppercase;
  font-family:Georgia,serif;font-style:italic;
  margin-right:4px;
}
.filter-btn{
  padding:6px 14px;border-radius:999px;
  border:1px solid var(--line);
  background:#fff;color:var(--ink-2);
  font-size:12px;cursor:pointer;font-family:inherit;
  transition:all .2s;
  display:inline-flex;align-items:center;gap:5px;
}
.filter-btn:hover{border-color:var(--line-strong);background:#f7f3ee}
.filter-btn.active{
  background:var(--accent);color:#fff;border-color:var(--accent);
  box-shadow:0 2px 8px rgba(201,162,126,.3);
}
.filter-btn .dot{
  width:8px;height:8px;border-radius:50%;
  background:currentColor;opacity:.8;
}

/* ── 列表头：四列等宽 ── */
.colhead{
  display:grid;
  grid-template-columns:44px 1fr 1fr 1fr 60px;
  gap:10px;margin:18px 0 10px;padding:0 4px;
  font-size:11.5px;font-weight:700;color:var(--muted);
  letter-spacing:1.5px;text-transform:uppercase;
  transition:grid-template-columns .2s;
}
.colhead span:nth-child(n+2){text-align:left}
.colhead span:last-child{text-align:center}

/* ── 表格行：四列等宽 ── */
.tbody{display:flex;flex-direction:column;gap:8px}
.row{
  display:grid;
  grid-template-columns:44px 1fr 1fr 1fr 60px;
  gap:10px;align-items:stretch;
  transition:grid-template-columns .2s;
}
.row .num{
  display:flex;align-items:center;justify-content:center;
  font-size:12px;color:var(--muted);font-family:Georgia,serif;font-style:italic;
}
.cell{
  height:46px;border-radius:var(--r-cell);
  background:var(--cell-draft);border:1px solid var(--line);
  transition:border-color .2s,background-color .3s;
  display:flex;align-items:center;
}
.cell:hover{border-color:var(--line-strong)}
.cell input{
  width:100%;height:100%;border:none;outline:none;
  padding:0 14px;font-size:14.5px;background:transparent;
  color:var(--ink);font-family:inherit;
}
.cell input::placeholder{color:var(--muted);opacity:.7}
.cell input:focus{color:var(--ink)}
.cell.word{background:var(--cell-word);border-color:transparent}
.cell.word input{font-family:Georgia,serif;font-style:italic;font-size:15px;color:var(--ink);font-weight:500}
.cell.answer{background:var(--cell-answer)}
.cell.answer input::placeholder{color:var(--muted)}

/* 默写单元格右侧的自动校验小提示 */
.cell.draft-cell{position:relative}
.cell.draft-cell .draft-badge{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  font-size:15px;font-weight:700;font-family:Georgia,serif;
  pointer-events:none;
  opacity:0;transition:opacity .2s;
}
.cell.draft-cell.is-correct .draft-badge{color:var(--correct);opacity:1}
.cell.draft-cell.is-wrong .draft-badge{color:var(--wrong);opacity:1}
.cell.draft-cell.is-correct .draft-badge::before{content:"✓"}
.cell.draft-cell.is-wrong .draft-badge::before{content:"✗"}
.cell.draft-cell.is-correct{background:rgba(111,184,146,.08)}
.cell.draft-cell.is-wrong{background:rgba(212,138,154,.08)}

/* ── 对错列 ── */
.cell.mark{
  cursor:pointer;
  justify-content:center;
  background:#fafafa;
  border:1.5px dashed var(--line);
  user-select:none;
  font-size:18px;
  font-weight:700;
  transition:all .2s;
}
.cell.mark:hover{
  border-color:var(--line-strong);
  background:#f7f3ee;
}
.cell.mark .mark-inner{
  display:flex;align-items:center;justify-content:center;
  width:100%;height:100%;
  font-family:Georgia,serif;
  color:var(--muted);
  opacity:.4;
}
.cell.mark.correct{
  background:rgba(111,184,146,.12);
  border:1.5px solid var(--correct);
  border-style:solid;
}
.cell.mark.correct .mark-inner{
  color:var(--correct);
  opacity:1;
}
.cell.mark.wrong{
  background:rgba(212,138,154,.12);
  border:1.5px solid var(--wrong);
  border-style:solid;
}
.cell.mark.wrong .mark-inner{
  color:var(--wrong);
  opacity:1;
}
.cell.mark.correct .mark-inner::before{content:"✓"}
.cell.mark.wrong .mark-inner::before{content:"✗"}
.cell.mark .mark-inner::before{content:"—"}

/* ── 行状态颜色 ── */
.row.is-correct .cell.draft-cell{
  background:rgba(111,184,146,.06);
}
.row.is-wrong .cell.draft-cell{
  background:rgba(212,138,154,.06);
}

/* ── 隐藏列的类 ── */
.hide-word-col .colhead span:nth-child(2),
.hide-word-col .row .cell.word { display: none; }

.hide-answer-col .colhead span:nth-child(3),
.hide-answer-col .row .cell.answer { display: none; }

/* 隐藏单词列：序号 + 释义 + 默写 + 对错 */
.hide-word-col .colhead,
.hide-word-col .row {
  grid-template-columns:44px 1fr 1fr 60px;
}

/* 隐藏释义列：序号 + 单词 + 默写 + 对错 */
.hide-answer-col .colhead,
.hide-answer-col .row {
  grid-template-columns:44px 1fr 1fr 60px;
}

/* 两列都隐藏：序号 + 默写 + 对错 */
.hide-word-col.hide-answer-col .colhead,
.hide-word-col.hide-answer-col .row {
  grid-template-columns:44px 1fr 60px;
}

/* ── 底部页码 ── */
.footer-row{
  margin-top:32px;display:flex;justify-content:space-between;align-items:center;
  gap:8px;flex-wrap:wrap;
  font-size:14px;color:var(--muted);font-family:Georgia,serif;font-style:italic;
}
.footer-row .right{
  display:flex;align-items:center;gap:8px;
}
.page-input{
  border:none;border-bottom:1.5px solid var(--line-strong);
  width:64px;font-size:17px;outline:none;text-align:center;
  background:transparent;color:var(--ink);font-family:Georgia,serif;font-style:italic;
  padding:2px 0;
}
.page-input:focus{border-bottom-color:var(--accent)}

/* ── 统计 ── */
.stats{
  display:flex;align-items:center;gap:14px;
  font-size:12.5px;color:var(--muted);
  font-family:Georgia,serif;font-style:italic;
}
.stats .stat-item{
  display:inline-flex;align-items:center;gap:5px;
}
.stats .stat-dot{
  width:8px;height:8px;border-radius:50%;
}
.stats .stat-dot.correct{background:var(--correct)}
.stats .stat-dot.wrong{background:var(--wrong)}
.stats .stat-dot.empty{background:var(--muted);opacity:.5}

/* ── Toast ── */
.toast{
  position:fixed;top:28px;left:50%;
  transform:translateX(-50%) translateY(-80px);
  background:rgba(61,58,54,.92);color:#fff;
  padding:11px 24px;border-radius:999px;font-size:13.5px;
  transition:transform .35s cubic-bezier(.2,.8,.3,1.2);
  z-index:999;pointer-events:none;backdrop-filter:blur(8px);
  box-shadow:0 8px 24px rgba(0,0,0,.18);
}
.toast.show{transform:translateX(-50%) translateY(0)}

/* ── 加载中提示 ── */
.loading{
  text-align:center;padding:60px 0;
  color:var(--muted);font-size:14px;
  font-family:Georgia,serif;font-style:italic;
}
.empty-hint{
  text-align:center;padding:40px 0;
  color:var(--muted);font-size:13.5px;
  font-family:Georgia,serif;font-style:italic;
}

/* ── 主题切换 ── */
.theme-blue{
  --accent:#6fa8c9;--accent-ink:#4a82a3;
  --cell-word:#dceaf4;--cell-answer:#f2f8fb;
}
.theme-yellow{
  --accent:#d4a94e;--accent-ink:#a8812f;
  --cell-word:#f7ecd0;--cell-answer:#fdf8ea;
}
.theme-pink{
  --accent:#d48a9a;--accent-ink:#a86273;
  --cell-word:#f6dde3;--cell-answer:#fdf3f5;
}
.theme-purple{
  --accent:#9b7ec4;--accent-ink:#74579e;
  --cell-word:#e6ddf2;--cell-answer:#f5f1fb;
}
.theme-mint{
  --accent:#6fb892;--accent-ink:#4a9069;
  --cell-word:#d8eee2;--cell-answer:#eff9f3;
}

/* ── 打印 ── */
@media print{
  body{background:#fff;padding:0}
  .toolbar,.actions,.theme-dots,.toast,.chapter-bar,.filter-bar{display:none!important}
  .page-card{box-shadow:none;border-radius:0;padding:14px;max-width:100%}
  .page-card::before{display:none}
  .cell{border:1px solid #999;break-inside:avoid}
  .title-input{border:none}
  .hide-answer-col .colhead span:nth-child(3),
  .hide-answer-col .row .cell.answer { display: none; }
  .cell.mark.correct .mark-inner::before{content:"✓"}
  .cell.mark.wrong .mark-inner::before{content:"✗"}
}

/* ── 响应式 ── */
@media (max-width:680px){
  body{padding:16px 10px 40px}
  .page-card{padding:24px 18px 20px;border-radius:16px}
  .page-card::before{left:18px;right:18px}
  .title-input{font-size:22px;width:100%}
  .header-row{flex-direction:column;align-items:flex-start;gap:6px}
  .chapter-bar{padding:10px 12px;gap:10px}
  .chapter-bar .label{font-size:11px}
  .chapter-pill input{width:42px;font-size:15px}
  .colhead{grid-template-columns:30px 1fr 1fr 1fr 44px;gap:6px}
  .row{grid-template-columns:30px 1fr 1fr 1fr 44px;gap:6px}
  .hide-word-col .colhead,
  .hide-word-col .row { grid-template-columns:30px 1fr 1fr 44px; }
  .hide-answer-col .colhead,
  .hide-answer-col .row { grid-template-columns:30px 1fr 1fr 44px; }
  .hide-word-col.hide-answer-col .colhead,
  .hide-word-col.hide-answer-col .row { grid-template-columns:30px 1fr 44px; }
  .cell{height:40px;border-radius:8px}
  .cell input{font-size:13.5px;padding:0 10px}
  .cell.mark{font-size:16px}
  .cell.draft-cell .draft-badge{font-size:13px;right:6px}
}
</style>
</head>
<body>
<div class="app">
  <div class="page-card theme-purple" id="card">
    <!-- 工具栏 -->
    <div class="toolbar">
      <div class="theme-dots" id="themeDots">
        <span class="theme-label">换肤</span>
        <span class="theme-dot active" data-theme="blue" title="浅蓝"></span>
        <span class="theme-dot" data-theme="yellow" title="奶黄"></span>
        <span class="theme-dot" data-theme="pink" title="豆沙粉"></span>
        <span class="theme-dot" data-theme="purple" title="香芋紫"></span>
        <span class="theme-dot" data-theme="mint" title="薄荷绿"></span>
      </div>
      <div class="actions">
        <button class="btn btn-check" onclick="checkAll()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          全部对比
        </button>
        <button class="btn" onclick="addRow()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          加一行
        </button>
        <button class="btn toggle-col active" id="toggleWordBtn" onclick="toggleWordCol()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <span class="btn-text">隐藏单词</span>
        </button>
        <button class="btn toggle-col active" id="toggleAnswerBtn" onclick="toggleAnswerCol()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <span class="btn-text">隐藏释义</span>
        </button>
        <button class="btn" onclick="clearTable()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          清空
        </button>
      </div>
    </div>

    <!-- 标题 -->
    <div class="header-row">
      <input class="title-input" id="titleInput" value="Memorize words" placeholder="输入标题">
      <span class="checkin">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        坚持打卡
      </span>
    </div>

    <!-- 章节切换栏 -->
    <div class="chapter-bar">
      <div class="label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        Chapter
      </div>

      <div class="chapter-nav">
        <button class="nav-btn" id="prevChapter" title="上一章">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div class="chapter-pill">
          <span class="prefix">L</span>
          <input type="text" id="chapterInput" value="1" inputmode="numeric" aria-label="章节">
          <span class="suffix" id="chapterSuffix">Lesson 1</span>
        </div>
        <button class="nav-btn" id="nextChapter" title="下一章">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
    </div>

    <!-- 筛选栏 -->
    <div class="filter-bar" id="filterBar">
      <span class="filter-label">筛选</span>
      <button class="filter-btn active" data-filter="all">
        <span class="dot"></span>全部
      </button>
      <button class="filter-btn" data-filter="wrong">
        <span class="dot" style="background:var(--wrong)"></span>只看错的
      </button>
      <button class="filter-btn" data-filter="correct">
        <span class="dot" style="background:var(--correct)"></span>只看对的
      </button>
      <button class="filter-btn" data-filter="empty">
        <span class="dot" style="background:var(--muted);opacity:.5"></span>未标记
      </button>
    </div>

    <!-- 列头 -->
    <div class="colhead" id="colhead">
      <span>#</span>
      <span class="col-word">单词 Word</span>
      <span class="col-answer">释义 Definition</span>
      <span>默写 Draft</span>
      <span>对错</span>
    </div>

    <!-- 行容器 -->
    <div class="tbody" id="tbody">
      <div class="loading">正在加载单词数据…</div>
    </div>

    <!-- 页码 + 统计 -->
    <div class="footer-row">
      <div class="stats" id="stats">
        <span class="stat-item"><span class="stat-dot correct"></span><span id="statCorrect">0</span></span>
        <span class="stat-item"><span class="stat-dot wrong"></span><span id="statWrong">0</span></span>
        <span class="stat-item"><span class="stat-dot empty"></span><span id="statEmpty">0</span></span>
      </div>
      <div class="right">
        <span>Page</span>
        <input class="page-input" id="pageInput" value="1">
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const STORAGE_KEY='wordMemoData_v4';
  const card=document.getElementById('card');
  const tbody=document.getElementById('tbody');
  const titleInput=document.getElementById('titleInput');
  const pageInput=document.getElementById('pageInput');
  const chapterInput=document.getElementById('chapterInput');
  const chapterSuffix=document.getElementById('chapterSuffix');
  const prevBtn=document.getElementById('prevChapter');
  const nextBtn=document.getElementById('nextChapter');
  const toggleWordBtn=document.getElementById('toggleWordBtn');
  const toggleAnswerBtn=document.getElementById('toggleAnswerBtn');
  const themeDots=document.getElementById('themeDots');
  const toastEl=document.getElementById('toast');
  const filterBar=document.getElementById('filterBar');
  const statCorrectEl=document.getElementById('statCorrect');
  const statWrongEl=document.getElementById('statWrong');
  const statEmptyEl=document.getElementById('statEmpty');
  let toastTimer=null;
  let showWordCol=true;
  let showAnswerCol=true;
  let currentFilter='all';
  let wordData=null;

  function toast(msg){
    toastEl.textContent=msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>toastEl.classList.remove('show'),1800);
  }

  function updateColumnVisibilityUI(){
    card.classList.toggle('hide-word-col', !showWordCol);
    card.classList.toggle('hide-answer-col', !showAnswerCol);
    toggleWordBtn.querySelector('.btn-text').textContent = showWordCol ? '隐藏单词' : '显示单词';
    toggleAnswerBtn.querySelector('.btn-text').textContent = showAnswerCol ? '隐藏释义' : '显示释义';
    toggleWordBtn.classList.toggle('active', showWordCol);
    toggleAnswerBtn.classList.toggle('active', showAnswerCol);
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  }

  // 归一化：忽略大小写、首尾空格、连续空格
  function normalize(s){
    return String(s == null ? '' : s)
      .trim()
      .replace(/\s+/g, ' ')
      .toLowerCase();
  }

  // 判断默写是否正确
  // 比较对象：默写 vs 单词（不是释义）
  function isDraftCorrect(draft, word){
    const d = normalize(draft);
    const w = normalize(word);
    if(!d || !w) return null;   // 空值不算对也不算错
    return d === w;
  }

  // 自动校验单个行
  function autoCheckRow(tr, force=false){
    const wordInput = tr.querySelector('.cell.word input');
    const draftInput = tr.querySelector('.cell.draft-cell input');
    const draftCell = tr.querySelector('.cell.draft-cell');
    const markCell = tr.querySelector('.cell.mark');
    if(!wordInput || !draftInput || !markCell) return;

    const result = isDraftCorrect(draftInput.value, wordInput.value);

    // 清除草稿格上的徽标
    draftCell.classList.remove('is-correct','is-wrong');

    if(result === null){
      // 未填写：不自动改对错列（保留手动标记）
      // 如果 force 则清除标记
      if(force){
        markCell.dataset.mark = '';
        markCell.classList.remove('correct','wrong');
        tr.classList.remove('is-correct','is-wrong');
      }
      return;
    }

    // 自动设置对错
    const next = result ? 'correct' : 'wrong';
    markCell.dataset.mark = next;
    markCell.classList.remove('correct','wrong');
    tr.classList.remove('is-correct','is-wrong');
    if(next === 'correct'){
      markCell.classList.add('correct');
      tr.classList.add('is-correct');
      draftCell.classList.add('is-correct');
    }else{
      markCell.classList.add('wrong');
      tr.classList.add('is-wrong');
      draftCell.classList.add('is-wrong');
    }
  }

  // 渲染一行
  function renderRow(cells,idx){
    const tr=document.createElement('div');
    tr.className='row';
    const wordVal = cells[0] || '';
    const answerVal = cells[1] || '';
    const draftVal = cells[2] || '';
    const markVal = cells[3] || '';
    const markClass = markVal === 'correct' ? 'correct' : (markVal === 'wrong' ? 'wrong' : '');
    if(markClass) tr.classList.add('is-' + markClass);

    tr.innerHTML=`
      <span class="num">${String(idx+1).padStart(2,'0')}</span>
      <div class="cell word"><input type="text" value="${escapeHtml(wordVal)}" placeholder="单词"></div>
      <div class="cell answer"><input type="text" value="${escapeHtml(answerVal)}" placeholder="释义"></div>
      <div class="cell draft-cell"><input type="text" value="${escapeHtml(draftVal)}" placeholder="默写"><span class="draft-badge"></span></div>
      <div class="cell mark ${markClass}" data-mark="${markVal}"><span class="mark-inner"></span></div>`;

    const draftInput = tr.querySelector('.cell.draft-cell input');
    const wordInput = tr.querySelector('.cell.word input');
    const draftCell = tr.querySelector('.cell.draft-cell');
    const markCell = tr.querySelector('.cell.mark');

    // 输入时保存
    tr.querySelectorAll('input').forEach(i=>i.addEventListener('input',save));

    // 失焦时自动对比
    draftInput.addEventListener('blur', ()=>{
      autoCheckRow(tr);
      save();
      updateStats();
      if(currentFilter !== 'all') applyFilter();
    });

    // 按回车自动对比 + 跳到下一行
    draftInput.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter'){
        e.preventDefault();
        autoCheckRow(tr);
        save();
        updateStats();
        if(currentFilter !== 'all') applyFilter();
        // 跳到下一行
        const allRows = Array.from(tbody.querySelectorAll('.row'));
        const idx2 = allRows.indexOf(tr);
        const nextRow = allRows[idx2+1];
        if(nextRow){
          const nextDraft = nextRow.querySelector('.cell.draft-cell input');
          if(nextDraft) nextDraft.focus();
        }else{
          draftInput.blur();
        }
      }
    });

    // 手动点击对错列：覆盖自动结果
    markCell.addEventListener('click', ()=>{
      const cur = markCell.dataset.mark || '';
      let next;
      if(cur === '') next = 'correct';
      else if(cur === 'correct') next = 'wrong';
      else next = '';
      markCell.dataset.mark = next;
      markCell.classList.remove('correct','wrong');
      tr.classList.remove('is-correct','is-wrong');
      draftCell.classList.remove('is-correct','is-wrong');
      if(next === 'correct'){
        markCell.classList.add('correct');
        tr.classList.add('is-correct');
        draftCell.classList.add('is-correct');
      }else if(next === 'wrong'){
        markCell.classList.add('wrong');
        tr.classList.add('is-wrong');
        draftCell.classList.add('is-wrong');
      }
      save();
      updateStats();
      if(currentFilter !== 'all') applyFilter();
    });

    // 初始化时如果已有内容，自动对比一次（不强制覆盖已有标记）
    if(markVal){
      // 已经有标记，仅更新草稿格的样式
      if(markVal === 'correct') draftCell.classList.add('is-correct');
      else if(markVal === 'wrong') draftCell.classList.add('is-wrong');
    }else{
      // 没有标记但已填了默写 → 自动判断
      autoCheckRow(tr, false);
    }

    return tr;
  }

  function renderTable(rows){
    tbody.innerHTML='';
    rows.forEach((r,i)=>tbody.appendChild(renderRow(r,i)));
    updateStats();
  }

  function chapterKey(){
    return String(parseInt(chapterInput.value,10) || 1);
  }

  function getChapterWords(ch){
    if(!wordData || !wordData.chapters) return [];
    return (wordData.chapters[ch] && wordData.chapters[ch].words) || [];
  }

  function getDrafts(){
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY + '_drafts') || '{}'); }
    catch(e){ return {}; }
  }

  function saveDrafts(drafts){
    try { localStorage.setItem(STORAGE_KEY + '_drafts', JSON.stringify(drafts)); } catch(e){}
  }

  function getMarks(){
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY + '_marks') || '{}'); }
    catch(e){ return {}; }
  }

  function saveMarks(marks){
    try { localStorage.setItem(STORAGE_KEY + '_marks', JSON.stringify(marks)); } catch(e){}
  }

  function save(){
    if(!wordData) return;
    const ch = chapterKey();

    const drafts = getDrafts();
    drafts[ch] = {};
    const marks = getMarks();
    marks[ch] = {};

    tbody.querySelectorAll('.row').forEach((tr, i) => {
      const inputs = tr.querySelectorAll('input');
      const draft = inputs[2] ? inputs[2].value : '';
      const markCell = tr.querySelector('.cell.mark');
      const mark = markCell ? (markCell.dataset.mark || '') : '';
      const item = getChapterWords(ch)[i];
      if(item){
        drafts[ch][item.id] = draft;
        if(mark) marks[ch][item.id] = mark;
      }
    });
    saveDrafts(drafts);
    saveMarks(marks);

    const data={
      title:titleInput.value,
      page:pageInput.value,
      chapter:ch,
      theme:(card.className.match(/theme-\w+/)||['theme-blue'])[0],
      showWordCol: showWordCol,
      showAnswerCol: showAnswerCol,
      filter: currentFilter
    };
    try{localStorage.setItem(STORAGE_KEY,JSON.stringify(data))}catch(e){}
  }

  function updateChapterNav(ch){
    if(!wordData || !wordData.chapters) return;
    const chNum = parseInt(ch,10) || 1;
    const keys = Object.keys(wordData.chapters).map(Number).sort((a,b)=>a-b);
    const min = keys[0] || 1;
    const max = keys[keys.length-1] || 1;
    prevBtn.disabled = chNum <= min;
    nextBtn.disabled = chNum >= max;
    chapterSuffix.textContent = 'Lesson ' + chNum;
  }

  function updateStats(){
    let c=0, w=0, e=0;
    tbody.querySelectorAll('.row').forEach(tr=>{
      const markCell = tr.querySelector('.cell.mark');
      const m = markCell ? (markCell.dataset.mark || '') : '';
      if(m === 'correct') c++;
      else if(m === 'wrong') w++;
      else e++;
    });
    statCorrectEl.textContent = c;
    statWrongEl.textContent = w;
    statEmptyEl.textContent = e;
  }

  function applyFilter(){
    const rows = tbody.querySelectorAll('.row');
    let visibleCount = 0;
    rows.forEach(tr=>{
      const markCell = tr.querySelector('.cell.mark');
      const m = markCell ? (markCell.dataset.mark || '') : '';
      let show = true;
      if(currentFilter === 'wrong') show = (m === 'wrong');
      else if(currentFilter === 'correct') show = (m === 'correct');
      else if(currentFilter === 'empty') show = (m === '');
      tr.style.display = show ? '' : 'none';
      if(show) visibleCount++;
    });

    let hint = tbody.querySelector('.empty-hint');
    if(visibleCount === 0 && rows.length > 0){
      if(!hint){
        hint = document.createElement('div');
        hint.className = 'empty-hint';
        tbody.appendChild(hint);
      }
      const txt = currentFilter === 'wrong' ? '还没有标记为"错"的单词' :
                  currentFilter === 'correct' ? '还没有标记为"对"的单词' :
                  '所有单词都已标记';
      hint.textContent = txt;
    }else if(hint){
      hint.remove();
    }
  }

  // 全部对比按钮
  window.checkAll=function(){
    let total=0, correct=0, wrong=0, empty=0;
    tbody.querySelectorAll('.row').forEach(tr=>{
      const wordInput = tr.querySelector('.cell.word input');
      const draftInput = tr.querySelector('.cell.draft-cell input');
      if(!wordInput || !draftInput) return;
      const draft = draftInput.value.trim();
      if(!draft){ empty++; return; }   // 未填的不算
      total++;
      autoCheckRow(tr, true);
      const markCell = tr.querySelector('.cell.mark');
      if(markCell && markCell.dataset.mark === 'correct') correct++;
      else if(markCell && markCell.dataset.mark === 'wrong') wrong++;
    });
    save();
    updateStats();
    if(currentFilter !== 'all') applyFilter();
    toast(`已对比 ${total} 条：✓ ${correct} · ✗ ${wrong}` + (empty ? ` · 未填 ${empty}` : ''));
  };

  function loadChapter(ch, notify=true){
    if(!wordData || !wordData.chapters){
      toast('单词数据尚未加载');
      return;
    }
    const chapter = wordData.chapters[ch];
    if(!chapter){
      toast('暂无第 ' + ch + ' 章数据');
      chapterInput.value = pageInput.value || '1';
      return;
    }
    const drafts = getDrafts()[ch] || {};
    const marks = getMarks()[ch] || {};
    const rows = chapter.words.map(w => [
      w.word,
      w.meaning,
      drafts[w.id] || '',
      marks[w.id] || ''
    ]);
    renderTable(rows);
    titleInput.value = chapter.chapter;
    pageInput.value = ch;
    chapterInput.value = ch;
    updateColumnVisibilityUI();
    updateChapterNav(ch);
    applyFilter();

    const theme = (localStorage.getItem(STORAGE_KEY + '_theme') || 'theme-blue').replace('theme-','');
    card.className = 'page-card theme-' + theme +
      (showWordCol ? '' : ' hide-word-col') +
      (showAnswerCol ? '' : ' hide-answer-col');
    themeDots.querySelectorAll('.theme-dot').forEach(d =>
      d.classList.toggle('active', d.dataset.theme === theme)
    );
    if(notify) toast('已切换到 ' + chapter.chapter);
  }

  window.addRow=function(){
    tbody.appendChild(renderRow(['','','',''],tbody.children.length));
    save();
    updateStats();
    if(currentFilter !== 'all') applyFilter();
    toast('已加一行');
  };

  window.clearTable=function(){
    if(!confirm('确定清空当前章节的默写和对错标记吗？'))return;
    const ch = chapterKey();
    const drafts = getDrafts();
    drafts[ch] = {};
    saveDrafts(drafts);
    const marks = getMarks();
    marks[ch] = {};
    saveMarks(marks);
    tbody.querySelectorAll('.row').forEach(tr => {
      const inputs=tr.querySelectorAll('input');
      if(inputs[2]) inputs[2].value='';
      const markCell = tr.querySelector('.cell.mark');
      const draftCell = tr.querySelector('.cell.draft-cell');
      if(markCell){
        markCell.dataset.mark = '';
        markCell.classList.remove('correct','wrong');
        tr.classList.remove('is-correct','is-wrong');
      }
      if(draftCell) draftCell.classList.remove('is-correct','is-wrong');
    });
    save();
    updateStats();
    applyFilter();
    toast('当前章节已清空');
  };

  window.toggleWordCol=function(){
    showWordCol = !showWordCol;
    updateColumnVisibilityUI();
    save();
    toast(showWordCol ? '单词列已显示' : '单词列已隐藏');
  };

  window.toggleAnswerCol=function(){
    showAnswerCol = !showAnswerCol;
    updateColumnVisibilityUI();
    save();
    toast(showAnswerCol ? '释义列已显示' : '释义列已隐藏');
  };

  filterBar.addEventListener('click',function(e){
    const btn = e.target.closest('.filter-btn');
    if(!btn) return;
    currentFilter = btn.dataset.filter || 'all';
    filterBar.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    applyFilter();
    save();
    const label = {all:'全部', wrong:'只看错的', correct:'只看对的', empty:'未标记'}[currentFilter];
    toast('筛选：' + label);
  });

  themeDots.addEventListener('click',function(e){
    const dot=e.target.closest('.theme-dot');
    if(!dot)return;
    const theme=dot.dataset.theme;
    card.className='page-card theme-'+theme +
      (showWordCol?'':' hide-word-col') +
      (showAnswerCol?'':' hide-answer-col');
    themeDots.querySelectorAll('.theme-dot').forEach(d=>d.classList.remove('active'));
    dot.classList.add('active');
    try{localStorage.setItem(STORAGE_KEY + '_theme','theme-'+theme)}catch(e){}
    save();
  });

  chapterInput.addEventListener('change',function(){
    loadChapter(String(parseInt(this.value,10) || 1));
  });
  chapterInput.addEventListener('keydown',function(e){
    if(e.key === 'Enter'){
      e.preventDefault();
      loadChapter(String(parseInt(this.value,10) || 1));
      this.blur();
    }
  });

  prevBtn.addEventListener('click',()=>{
    const ch = parseInt(chapterInput.value,10) || 1;
    if(ch > 1) loadChapter(String(ch-1));
  });
  nextBtn.addEventListener('click',()=>{
    const ch = parseInt(chapterInput.value,10) || 1;
    if(wordData && wordData.chapters && wordData.chapters[String(ch+1)]) {
      loadChapter(String(ch+1));
    }
  });

  titleInput.addEventListener('input',save);
  pageInput.addEventListener('input',save);

  async function fetchWordData(){
    const res = await fetch('./words.json', { cache: 'no-cache' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  }

  async function init(){
    let data={};
    try{ data=JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }catch(e){}
    showWordCol = data.showWordCol !== undefined ? data.showWordCol : true;
    showAnswerCol = data.showAnswerCol !== undefined ? data.showAnswerCol : true;
    currentFilter = data.filter || 'all';

    filterBar.querySelectorAll('.filter-btn').forEach(b=>{
      b.classList.toggle('active', b.dataset.filter === currentFilter);
    });

    try{
      wordData = await fetchWordData();
    }catch(err){
      console.error(err);
      tbody.innerHTML = `<div class="loading">⚠️ 加载 words.json 失败：${escapeHtml(err.message)}<br>
        请确认：<br>1. words.json 与本文件在同一目录<br>
        2. 通过 http:// 服务器打开（不能直接双击 .html）</div>`;
      toast('words.json 加载失败');
      return;
    }

    const ch = data.chapter || data.page || '1';
    chapterInput.value = ch;
    loadChapter(ch, false);
  }

  init();
})();
</script>
</body>
</html>
