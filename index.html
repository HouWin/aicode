<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>华研专八词汇练习-子祺版</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
<style>
:root{
  --bg-1:#f6f1ea;
  --bg-2:#eef2f6;
  --card:#ffffff;
  --ink:#3d3a36;
  --ink-2:#6b6660;
  --muted:#b5aea6;
  --line:#e3ddd5;
  --line-strong:#cfc7bd;
  --accent:#c9a27e;
  --accent-ink:#8a6844;
  --cell-word:#f0e8dd;
  --cell-draft:#ffffff;
  --cell-answer:#faf6f0;
  --shadow:0 2px 6px rgba(120,105,90,.06),0 18px 48px rgba(120,105,90,.10);
  --r-card:22px;
  --r-cell:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,sans-serif;
  background:
    radial-gradient(120% 80% at 20% 0%, var(--bg-1), transparent 60%),
    radial-gradient(120% 80% at 100% 100%, var(--bg-2), transparent 55%),
    #f4f0ea;
  min-height:100vh;padding:40px 20px 60px;color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
.app{max-width:960px;margin:0 auto}

/* ── 卡片 ── */
.page-card{
  background:var(--card);border-radius:var(--r-card);
  padding:44px 48px 36px;box-shadow:var(--shadow);
  position:relative;
  transition:background-color .4s ease;
}
.page-card::before{
  content:"";position:absolute;left:48px;right:48px;top:0;height:4px;
  background:linear-gradient(90deg,var(--accent),transparent 80%);
  border-radius:0 0 4px 4px;opacity:.7;
}

/* ── 工具栏 ── */
.toolbar{
  display:flex;justify-content:space-between;align-items:center;
  flex-wrap:wrap;gap:14px;margin-bottom:28px;
}
.theme-dots{display:flex;align-items:center;gap:10px}
.theme-label{font-size:12.5px;color:var(--muted);letter-spacing:.5px;margin-right:2px}
.theme-dot{
  width:24px;height:24px;border-radius:50%;cursor:pointer;
  border:2.5px solid #fff;box-shadow:0 0 0 1.5px var(--line-strong),0 2px 5px rgba(0,0,0,.08);
  transition:transform .2s cubic-bezier(.2,.8,.3,1.2),box-shadow .2s;
}
.theme-dot:hover{transform:scale(1.15)}
.theme-dot.active{
  transform:scale(1.12);
  box-shadow:0 0 0 2px var(--accent),0 3px 8px rgba(0,0,0,.12);
}
.theme-dot[data-theme="blue"]   {background:#cfe3f0}
.theme-dot[data-theme="yellow"] {background:#f5e6b8}
.theme-dot[data-theme="pink"]   {background:#f2ccd6}
.theme-dot[data-theme="purple"]{background:#d8ccee}
.theme-dot[data-theme="mint"]   {background:#c9e8d6}

.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:9px 16px;border:1px solid var(--line);
  border-radius:999px;font-size:13px;cursor:pointer;
  background:#fff;color:var(--ink-2);font-family:inherit;
  transition:all .2s;
}
.btn:hover{background:#f7f3ee;border-color:var(--line-strong);transform:translateY(-1px)}
.btn svg{width:14px;height:14px}
.btn.toggle-col{
  background:#f9f6f2; border-color:var(--line-strong);
  font-size:12.5px; padding:7px 12px;
}
.btn.toggle-col.active{
  background:var(--accent); color:#fff; border-color:var(--accent);
  box-shadow:0 2px 8px rgba(201,162,126,.3);
}

/* ── 标题区 ── */
.header-row{
  display:flex;justify-content:space-between;align-items:flex-end;
  margin-bottom:8px;padding-bottom:18px;
  border-bottom:2px solid var(--line);
  position:relative;
}
.header-row::after{
  content:"";position:absolute;left:0;bottom:-2px;width:64px;height:2px;
  background:var(--accent);
}
.title-input{
  font-size:32px;font-weight:600;border:none;outline:none;
  width:420px;background:transparent;color:var(--ink);
  font-family:Georgia,"Times New Roman",serif;font-style:italic;
  letter-spacing:.3px;
}
.checkin{
  font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;
  font-family:Georgia,serif;font-style:italic;
}
.checkin svg{width:15px;height:15px;color:var(--accent)}

/* ── 章节切换栏（新增，移到上方） ── */
.chapter-bar{
  display:flex;align-items:center;justify-content:space-between;
  gap:14px;margin:20px 0 6px;
  padding:12px 16px;
  background:linear-gradient(135deg, var(--cell-answer), #fff);
  border:1px solid var(--line);
  border-radius:14px;
  flex-wrap:wrap;
}
.chapter-bar .label{
  font-size:12px;font-weight:700;color:var(--muted);
  letter-spacing:1.5px;text-transform:uppercase;
  display:flex;align-items:center;gap:8px;
  font-family:Georgia,serif;font-style:italic;
}
.chapter-bar .label svg{width:15px;height:15px;color:var(--accent)}

.chapter-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chapter-nav .nav-btn{
  width:34px;height:34px;border-radius:50%;
  border:1px solid var(--line);
  background:#fff;color:var(--ink-2);
  display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .2s;
}
.chapter-nav .nav-btn:hover{
  background:var(--accent);color:#fff;border-color:var(--accent);
  transform:translateY(-1px);
  box-shadow:0 4px 10px rgba(201,162,126,.3);
}
.chapter-nav .nav-btn svg{width:14px;height:14px}
.chapter-nav .nav-btn:disabled{
  opacity:.35;cursor:not-allowed;transform:none;
  background:#fff;color:var(--muted);border-color:var(--line);
  box-shadow:none;
}

.chapter-pill{
  display:flex;align-items:center;gap:4px;
  padding:0 6px;height:38px;
  background:#fff;border:1.5px solid var(--line-strong);
  border-radius:999px;
  transition:border-color .2s, box-shadow .2s;
}
.chapter-pill:focus-within{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(201,162,126,.15);
}
.chapter-pill .prefix{
  font-size:11px;color:var(--muted);font-weight:700;
  letter-spacing:1px;text-transform:uppercase;
  font-family:Georgia,serif;font-style:italic;
  padding-left:8px;
}
.chapter-pill input{
  border:none;outline:none;background:transparent;
  width:52px;text-align:center;
  font-size:16px;font-weight:600;
  font-family:Georgia,serif;font-style:italic;
  color:var(--ink);
}
.chapter-pill .suffix{
  font-size:11px;color:var(--muted);
  padding-right:10px;white-space:nowrap;
  font-family:Georgia,serif;font-style:italic;
}

.chapter-quick{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  padding:6px 12px;border-radius:999px;
  border:1px solid var(--line);
  background:#fff;color:var(--ink-2);
  font-size:12px;cursor:pointer;
  font-family:inherit;
  transition:all .2s;
}
.chip:hover{border-color:var(--line-strong);background:#f7f3ee}
.chip.active{
  background:var(--accent);color:#fff;border-color:var(--accent);
  box-shadow:0 2px 8px rgba(201,162,126,.3);
}

/* ── 列表头 ── */
.colhead{
  display:grid;
  grid-template-columns:44px 1fr 1.7fr 1fr;
  gap:10px;margin:18px 0 10px;padding:0 4px;
  font-size:11.5px;font-weight:700;color:var(--muted);
  letter-spacing:1.5px;text-transform:uppercase;
  transition:grid-template-columns .2s;
}
.colhead span:nth-child(n+2){text-align:left}

/* ── 表格行 ── */
.tbody{display:flex;flex-direction:column;gap:8px}
.row{
  display:grid;
  grid-template-columns:44px 1fr 1.7fr 1fr;
  gap:10px;align-items:stretch;
  transition:grid-template-columns .2s;
}
.row .num{
  display:flex;align-items:center;justify-content:center;
  font-size:12px;color:var(--muted);font-family:Georgia,serif;font-style:italic;
}
.cell{
  height:46px;border-radius:var(--r-cell);
  background:var(--cell-draft);border:1px solid var(--line);
  transition:border-color .2s,background-color .3s;
  display:flex;align-items:center;
}
.cell:hover{border-color:var(--line-strong)}
.cell input{
  width:100%;height:100%;border:none;outline:none;
  padding:0 14px;font-size:14.5px;background:transparent;
  color:var(--ink);font-family:inherit;
}
.cell input::placeholder{color:var(--muted);opacity:.7}
.cell input:focus{color:var(--ink)}
.cell.word{background:var(--cell-word);border-color:transparent}
.cell.word input{font-family:Georgia,serif;font-style:italic;font-size:15px;color:var(--ink);font-weight:500}
.cell.answer{background:var(--cell-answer)}
.cell.answer input::placeholder{color:var(--muted)}

/* ── 隐藏列的类 ── */
.hide-word-col .colhead span:nth-child(2),
.hide-word-col .row .cell.word { display: none; }

.hide-answer-col .colhead span:nth-child(3),
.hide-answer-col .row .cell.answer { display: none; }

.hide-word-col .colhead,
.hide-word-col .row {
  grid-template-columns:44px 1.7fr 1fr;
}

.hide-answer-col .colhead,
.hide-answer-col .row {
  grid-template-columns:44px 1fr 1fr;
}

.hide-word-col.hide-answer-col .colhead,
.hide-word-col.hide-answer-col .row {
  grid-template-columns:44px 1fr;
}

/* ── 底部页码 ── */
.footer-row{
  margin-top:32px;display:flex;justify-content:flex-end;align-items:center;gap:8px;
  font-size:14px;color:var(--muted);font-family:Georgia,serif;font-style:italic;
}
.page-input{
  border:none;border-bottom:1.5px solid var(--line-strong);
  width:64px;font-size:17px;outline:none;text-align:center;
  background:transparent;color:var(--ink);font-family:Georgia,serif;font-style:italic;
  padding:2px 0;
}
.page-input:focus{border-bottom-color:var(--accent)}

/* ── Toast ── */
.toast{
  position:fixed;top:28px;left:50%;
  transform:translateX(-50%) translateY(-80px);
  background:rgba(61,58,54,.92);color:#fff;
  padding:11px 24px;border-radius:999px;font-size:13.5px;
  transition:transform .35s cubic-bezier(.2,.8,.3,1.2);
  z-index:999;pointer-events:none;backdrop-filter:blur(8px);
  box-shadow:0 8px 24px rgba(0,0,0,.18);
}
.toast.show{transform:translateX(-50%) translateY(0)}

/* ── 主题切换 ── */
.theme-blue{
  --accent:#6fa8c9;--accent-ink:#4a82a3;
  --cell-word:#dceaf4;--cell-answer:#f2f8fb;
}
.theme-yellow{
  --accent:#d4a94e;--accent-ink:#a8812f;
  --cell-word:#f7ecd0;--cell-answer:#fdf8ea;
}
.theme-pink{
  --accent:#d48a9a;--accent-ink:#a86273;
  --cell-word:#f6dde3;--cell-answer:#fdf3f5;
}
.theme-purple{
  --accent:#9b7ec4;--accent-ink:#74579e;
  --cell-word:#e6ddf2;--cell-answer:#f5f1fb;
}
.theme-mint{
  --accent:#6fb892;--accent-ink:#4a9069;
  --cell-word:#d8eee2;--cell-answer:#eff9f3;
}

/* ── 打印 ── */
@media print{
  body{background:#fff;padding:0}
  .toolbar,.actions,.theme-dots,.toast,.chapter-bar{display:none!important}
  .page-card{box-shadow:none;border-radius:0;padding:14px;max-width:100%}
  .page-card::before{display:none}
  .cell{border:1px solid #999;break-inside:avoid}
  .title-input{border:none}
  .hide-answer-col .colhead span:nth-child(3),
  .hide-answer-col .row .cell.answer { display: none; }
}

/* ── 响应式 ── */
@media (max-width:680px){
  body{padding:16px 10px 40px}
  .page-card{padding:24px 18px 20px;border-radius:16px}
  .page-card::before{left:18px;right:18px}
  .title-input{font-size:22px;width:100%}
  .header-row{flex-direction:column;align-items:flex-start;gap:6px}
  .chapter-bar{padding:10px 12px;gap:10px}
  .chapter-bar .label{font-size:11px}
  .chapter-pill input{width:42px;font-size:15px}
  .chip{padding:5px 10px;font-size:11.5px}
  .colhead{grid-template-columns:30px 1fr 1fr;gap:6px}
  .row{grid-template-columns:30px 1fr 1fr;gap:6px}
  .hide-word-col .colhead,
  .hide-word-col .row { grid-template-columns:30px 1fr 1fr; }
  .hide-answer-col .colhead,
  .hide-answer-col .row { grid-template-columns:30px 1fr 1fr; }
  .hide-word-col.hide-answer-col .colhead,
  .hide-word-col.hide-answer-col .row { grid-template-columns:30px 1fr; }
  .cell{height:40px;border-radius:8px}
  .cell input{font-size:13.5px;padding:0 10px}
}
</style>
</head>
<body>
<div class="app">
  <div class="page-card theme-purple" id="card">
    <!-- 工具栏 -->
    <div class="toolbar">
      <div class="theme-dots" id="themeDots">

        <span class="theme-dot" data-theme="pink" title="豆沙粉"></span>
        <span class="theme-dot" data-theme="purple" title="香芋紫"></span>
        <span class="theme-dot" data-theme="mint" title="薄荷绿"></span>
      </div>
      <div class="actions">
        <button class="btn" onclick="addRow()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          加一行
        </button>
        <button class="btn toggle-col active" id="toggleWordBtn" onclick="toggleWordCol()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <span class="btn-text">隐藏单词</span>
        </button>
        <button class="btn toggle-col active" id="toggleAnswerBtn" onclick="toggleAnswerCol()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <span class="btn-text">隐藏释义</span>
        </button>
        <button class="btn" onclick="clearTable()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          清空
        </button>
      </div>
    </div>

    <!-- 标题 -->
    <div class="header-row">
      <input class="title-input" id="titleInput" value="Memorize words" placeholder="输入标题">
      <span class="checkin">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        坚持打卡
      </span>
    </div>

    <!-- 章节切换栏（移到上方） -->
    <div class="chapter-bar">
      <div class="label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        Chapter
      </div>

      <div class="chapter-nav">
        <button class="nav-btn" id="prevChapter" title="上一章">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div class="chapter-pill">
          <span class="prefix">L</span>
          <input type="text" id="chapterInput" value="1" inputmode="numeric" aria-label="章节">
          <span class="suffix" id="chapterSuffix">Lesson 1</span>
        </div>
        <button class="nav-btn" id="nextChapter" title="下一章">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>

      <div class="chapter-quick" id="chapterQuick">
        <!-- 快捷章节按钮由 JS 生成 -->
      </div>
    </div>

    <!-- 列头 -->
    <div class="colhead" id="colhead">
      <span>#</span>
      <span class="col-word">单词 Word</span>
      <span class="col-answer">释义 Definition</span>
      <span>默写 Draft</span>
    </div>

    <!-- 行容器 -->
    <div class="tbody" id="tbody"></div>

    <!-- 页码 -->
    <div class="footer-row">
      <span>Page</span>
      <input class="page-input" id="pageInput" value="1">
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const STORAGE_KEY='wordMemoData_v4';
  const card=document.getElementById('card');
  const tbody=document.getElementById('tbody');
  const titleInput=document.getElementById('titleInput');
  const pageInput=document.getElementById('pageInput');
  const chapterInput=document.getElementById('chapterInput');
  const chapterSuffix=document.getElementById('chapterSuffix');
  const chapterQuick=document.getElementById('chapterQuick');
  const prevBtn=document.getElementById('prevChapter');
  const nextBtn=document.getElementById('nextChapter');
  const wordData=JSON.parse(document.getElementById('word-data').textContent);
  const toggleWordBtn=document.getElementById('toggleWordBtn');
  const toggleAnswerBtn=document.getElementById('toggleAnswerBtn');
  const themeDots=document.getElementById('themeDots');
  const toastEl=document.getElementById('toast');
  let toastTimer=null;
  let showWordCol=true;
  let showAnswerCol=true;

  function toast(msg){
    toastEl.textContent=msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>toastEl.classList.remove('show'),1800);
  }

  function updateColumnVisibilityUI(){
    card.classList.toggle('hide-word-col', !showWordCol);
    card.classList.toggle('hide-answer-col', !showAnswerCol);
    toggleWordBtn.querySelector('.btn-text').textContent = showWordCol ? '隐藏单词' : '显示单词';
    toggleAnswerBtn.querySelector('.btn-text').textContent = showAnswerCol ? '隐藏释义' : '显示释义';
    toggleWordBtn.classList.toggle('active', showWordCol);
    toggleAnswerBtn.classList.toggle('active', showAnswerCol);
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  }

  function renderRow(cells,idx){
    const tr=document.createElement('div');
    tr.className='row';
    const wordVal = cells[0] || '';
    const answerVal = cells[1] || '';
    const draftVal = cells[2] || '';
    tr.innerHTML=`
      <span class="num">${String(idx+1).padStart(2,'0')}</span>
      <div class="cell word"><input type="text" value="${escapeHtml(wordVal)}" placeholder="单词"></div>
      <div class="cell answer"><input type="text" value="${escapeHtml(answerVal)}" placeholder="释义"></div>
      <div class="cell"><input type="text" value="${escapeHtml(draftVal)}" placeholder="默写"></div>`;
    tr.querySelectorAll('input').forEach(i=>i.addEventListener('input',save));
    return tr;
  }

  function renderTable(rows){
    tbody.innerHTML='';
    rows.forEach((r,i)=>tbody.appendChild(renderRow(r,i)));
  }

  function chapterKey(){
    return String(parseInt(chapterInput.value,10) || 1);
  }

  function getChapterWords(ch){
    return (wordData.chapters[ch] && wordData.chapters[ch].words) || [];
  }

  function getDrafts(){
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY + '_drafts') || '{}'); }
    catch(e){ return {}; }
  }

  function saveDrafts(drafts){
    try { localStorage.setItem(STORAGE_KEY + '_drafts', JSON.stringify(drafts)); } catch(e){}
  }

  function save(){
    const ch = chapterKey();
    const drafts = getDrafts();
    drafts[ch] = {};
    tbody.querySelectorAll('.row').forEach((tr, i) => {
      const inputs = tr.querySelectorAll('input');
      const draft = inputs[2] ? inputs[2].value : '';
      const item = getChapterWords(ch)[i];
      if(item) drafts[ch][item.id] = draft;
    });
    saveDrafts(drafts);

    const data={
      title:titleInput.value,
      page:pageInput.value,
      chapter:ch,
      theme:(card.className.match(/theme-\w+/)||['theme-blue'])[0],
      showWordCol: showWordCol,
      showAnswerCol: showAnswerCol
    };
    try{localStorage.setItem(STORAGE_KEY,JSON.stringify(data))}catch(e){}
  }

  function updateChapterNav(ch){
    const chNum = parseInt(ch,10) || 1;
    const keys = Object.keys(wordData.chapters).map(Number).sort((a,b)=>a-b);
    const min = keys[0] || 1;
    const max = keys[keys.length-1] || 1;
    prevBtn.disabled = chNum <= min;
    nextBtn.disabled = chNum >= max;
    chapterSuffix.textContent = 'Lesson ' + chNum;
  }

  function buildQuickChips(){
    chapterQuick.innerHTML='';
    const keys = Object.keys(wordData.chapters).map(Number).sort((a,b)=>a-b);
    keys.forEach(k=>{
      const chip=document.createElement('button');
      chip.className='chip';
      chip.dataset.chapter=k;
      chip.textContent='L'+k;
      chip.onclick=()=>loadChapter(String(k));
      chapterQuick.appendChild(chip);
    });
  }

  function highlightQuick(ch){
    chapterQuick.querySelectorAll('.chip').forEach(c=>{
      c.classList.toggle('active', c.dataset.chapter === String(ch));
    });
  }

  function loadChapter(ch, notify=true){
    const chapter = wordData.chapters[ch];
    if(!chapter){
      toast('暂无第 ' + ch + ' 章数据');
      chapterInput.value = pageInput.value || '1';
      return;
    }
    const drafts = getDrafts()[ch] || {};
    const rows = chapter.words.map(w => [w.word, w.meaning, drafts[w.id] || '']);
    renderTable(rows);
    titleInput.value = chapter.chapter;
    pageInput.value = ch;
    chapterInput.value = ch;
    updateColumnVisibilityUI();
    updateChapterNav(ch);
    highlightQuick(ch);

    const theme = (localStorage.getItem(STORAGE_KEY + '_theme') || 'theme-blue').replace('theme-','');
    card.className = 'page-card theme-' + theme +
      (showWordCol ? '' : ' hide-word-col') +
      (showAnswerCol ? '' : ' hide-answer-col');
    themeDots.querySelectorAll('.theme-dot').forEach(d =>
      d.classList.toggle('active', d.dataset.theme === theme)
    );
    if(notify) toast('已切换到 ' + chapter.chapter);
  }

  window.addRow=function(){
    tbody.appendChild(renderRow(['','',''],tbody.children.length));
    save();
    toast('已加一行');
  };

  window.clearTable=function(){
    if(!confirm('确定清空当前章节的默写内容吗？'))return;
    const ch = chapterKey();
    const drafts = getDrafts();
    drafts[ch] = {};
    saveDrafts(drafts);
    tbody.querySelectorAll('.row').forEach(tr => {
      const inputs=tr.querySelectorAll('input');
      if(inputs[2]) inputs[2].value='';
    });
    save();
    toast('当前章节已清空');
  };

  window.toggleWordCol=function(){
    showWordCol = !showWordCol;
    updateColumnVisibilityUI();
    save();
    toast(showWordCol ? '单词列已显示' : '单词列已隐藏');
  };

  window.toggleAnswerCol=function(){
    showAnswerCol = !showAnswerCol;
    updateColumnVisibilityUI();
    save();
    toast(showAnswerCol ? '释义列已显示' : '释义列已隐藏');
  };

  themeDots.addEventListener('click',function(e){
    const dot=e.target.closest('.theme-dot');
    if(!dot)return;
    const theme=dot.dataset.theme;
    card.className='page-card theme-'+theme +
      (showWordCol?'':' hide-word-col') +
      (showAnswerCol?'':' hide-answer-col');
    themeDots.querySelectorAll('.theme-dot').forEach(d=>d.classList.remove('active'));
    dot.classList.add('active');
    try{localStorage.setItem(STORAGE_KEY + '_theme','theme-'+theme)}catch(e){}
    save();
  });

  // 章节切换
  chapterInput.addEventListener('change',function(){
    loadChapter(String(parseInt(this.value,10) || 1));
  });
  chapterInput.addEventListener('keydown',function(e){
    if(e.key === 'Enter'){
      e.preventDefault();
      loadChapter(String(parseInt(this.value,10) || 1));
      this.blur();
    }
  });

  prevBtn.addEventListener('click',()=>{
    const ch = parseInt(chapterInput.value,10) || 1;
    if(ch > 1) loadChapter(String(ch-1));
  });
  nextBtn.addEventListener('click',()=>{
    const ch = parseInt(chapterInput.value,10) || 1;
    if(wordData.chapters[String(ch+1)]) loadChapter(String(ch+1));
  });

  titleInput.addEventListener('input',save);
  pageInput.addEventListener('input',save);

  // 初始化
  (function init(){
    let data={};
    try{ data=JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }catch(e){}
    showWordCol = data.showWordCol !== undefined ? data.showWordCol : true;
    showAnswerCol = data.showAnswerCol !== undefined ? data.showAnswerCol : true;
    buildQuickChips();
    const ch = data.chapter || data.page || '1';
    chapterInput.value = ch;
    loadChapter(ch, false);
  })();
})();
</script>
